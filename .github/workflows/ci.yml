name: CI

# All jobs use GitHub-hosted standard runners, which are free for public
# repositories.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autotools:
    name: Autotools ${{ matrix.os }} ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: default
    env:
      XSTL_PATH: ${{ github.workspace }}/xStl
    steps:
      - uses: actions/checkout@v5
        with:
          path: dismount

      - uses: actions/checkout@v5
        with:
          repository: eladraz/xStl
          path: xStl

      - name: Select clang
        if: matrix.cc == 'clang'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool

      - name: Build xStl
        working-directory: xStl
        run: ./build.sh

      - name: Build dismount
        working-directory: dismount
        run: |
          set -o pipefail
          ./autogen.sh
          ./configure --prefix="$PWD/out" --enable-debug --enable-unicode --enable-tests --with-xstl="$XSTL_PATH"
          make -j 4 2>&1 | tee build.log
          make install

      # Show the compiler and linker errors as annotations of the run
      - name: Show build errors
        if: failure()
        working-directory: dismount
        run: |
          grep -E "error|undefined reference|cannot find" build.log | head -20 | sed 's/^/::error::/' || true
          tail -20 config.log 2>/dev/null | sed 's/^/::warning::config.log: /' || true

      - name: Run tests
        working-directory: dismount
        run: ./out/bin/test_dismount

  cmake:
    name: CMake ${{ matrix.os }} ${{ matrix.cc }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
        build_type: [Debug, Release]
        cc: [default]
        include:
          # Linux x64 with both compilers
          - os: ubuntu-latest
            build_type: Debug
            cc: clang
          - os: ubuntu-latest
            build_type: Release
            cc: clang
    env:
      XSTL_PATH: ${{ github.workspace }}/xStl
      # The IA-32 test corpus is generated with and compared against nasm 3.02
      NASM_VERSION: "3.02"
    steps:
      - uses: actions/checkout@v5
        with:
          path: dismount

      - uses: actions/checkout@v5
        with:
          repository: eladraz/xStl
          path: xStl

      - name: Select clang
        if: matrix.cc == 'clang'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      # The distributions ship other nasm versions, which encode and accept a
      # different instruction set, so build the exact version from source
      - name: Install nasm
        run: |
          curl -fsSL "https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/nasm-$NASM_VERSION.tar.xz" | tar xJ
          cd "nasm-$NASM_VERSION"
          ./configure --prefix="$HOME/nasm"
          make -j 4
          make install
          echo "$HOME/nasm/bin" >> "$GITHUB_PATH"

      - name: Check nasm
        run: nasm -v | grep -F "NASM version $NASM_VERSION "

      - name: Build xStl
        working-directory: xStl
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build -j 4

      - name: Build dismount
        working-directory: dismount
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DDISMOUNT_BUILD_TESTS=ON
          cmake --build build -j 4 2>&1 | tee build.log

      # Show the compiler and linker errors as annotations of the run
      - name: Show build errors
        if: failure()
        working-directory: dismount
        run: grep -E "error|undefined reference|cannot find" build.log | head -20 | sed 's/^/::error::/' || true

      - name: Run unit tests
        working-directory: dismount
        run: ./out/bin/test_dismount

      - name: Check assembler error reporting
        working-directory: dismount
        run: python3 tests/ia32/run_compat.py --selftest

      - name: Compare with nasm
        working-directory: dismount
        run: python3 tests/ia32/run_compat.py --strict

      - name: Fuzz instruction lengths
        working-directory: dismount
        run: |
          python3 tests/ia32/tools/fuzz_lengths.py --count 50000 --seed 1
          python3 tests/ia32/tools/fuzz_lengths.py --count 50000 --seed 1 --bits 16
          python3 tests/ia32/tools/fuzz_lengths.py --count 50000 --seed 1 --bits 64

      - name: Upload compatibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.build_type }}
          path: dismount/out/compat
          if-no-files-found: ignore

  windows:
    name: MSBuild windows ${{ matrix.platform }} ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
        configuration: [Debug, Release]
    env:
      # The Visual Studio projects locate sources and headers through these
      XSTL_PATH: ${{ github.workspace }}\xStl
      DISMOUNT_PATH: ${{ github.workspace }}\dismount
    steps:
      # testDismount.vcxproj references ..\..\xStl, so check out side by side
      - uses: actions/checkout@v5
        with:
          path: dismount

      - uses: actions/checkout@v5
        with:
          repository: eladraz/xStl
          path: xStl

      - uses: microsoft/setup-msbuild@v2

      # The projects don't pin a toolset the runner has, so build with the
      # installed v143 toolset. Building the tests also builds xStl and dismount.
      - name: Build tests
        working-directory: dismount
        shell: pwsh
        run: |
          msbuild tests\testDismount.vcxproj -m `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # Show the compiler and linker errors as annotations of the run
      - name: Show build errors
        if: failure()
        working-directory: dismount
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Select-String -Path build.log -Pattern ': (fatal )?error |error LNK|error MSB' |
              ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 50 |
              ForEach-Object { Write-Output "::error::$_" }
          }

      - name: Run tests
        shell: pwsh
        working-directory: dismount\tests
        run: |
          $exe = Get-ChildItem -Recurse -Filter testDismount.exe | Select-Object -First 1
          if (-not $exe) { throw "testDismount.exe not found" }
          Push-Location $exe.DirectoryName
          & $exe.FullName 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP\tests.log
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) {
            # The end of the output, where the failing test is, as one annotation
            # (a step shows at most 10 of them; %0A is a new line in it)
            $tail = (Get-Content $env:RUNNER_TEMP\tests.log -Tail 60 | ForEach-Object { $_.TrimEnd() }) -join '%0A'
            Write-Output "::error title=testDismount failed::$tail"
            exit $code
          }

  coverity:
    name: Coverity Scan
    # Coverity Scan is free for open-source projects. It runs on pushes to master
    # only, and only when the COVERITY_SCAN_TOKEN repository secret is set.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'eladraz/dismount'
    runs-on: ubuntu-latest
    env:
      COVERITY_SCAN_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
      COVERITY_PROJECT: eladraz/dismount
      XSTL_PATH: ${{ github.workspace }}/xStl
    steps:
      - uses: actions/checkout@v5
        with:
          path: dismount

      - uses: actions/checkout@v5
        with:
          repository: eladraz/xStl
          path: xStl

      - name: Check token
        id: token
        run: |
          if [ -z "$COVERITY_SCAN_TOKEN" ]; then
            echo "COVERITY_SCAN_TOKEN is not set; skipping Coverity Scan"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Coverity build tool
        if: steps.token.outputs.present == 'true'
        run: |
          curl -fsSL -o cov-analysis.tgz \
            --form project="$COVERITY_PROJECT" --form token="$COVERITY_SCAN_TOKEN" \
            https://scan.coverity.com/download/cxx/linux64
          mkdir cov-analysis
          tar xzf cov-analysis.tgz --strip-components=1 -C cov-analysis

      - name: Build xStl
        if: steps.token.outputs.present == 'true'
        working-directory: xStl
        run: |
          sudo apt-get update && sudo apt-get install -y autoconf automake libtool
          ./build.sh

      - name: Build with cov-build
        if: steps.token.outputs.present == 'true'
        working-directory: dismount
        run: |
          ./autogen.sh
          ./configure --prefix="$PWD/out" --enable-debug --enable-unicode --with-xstl="$XSTL_PATH"
          ../cov-analysis/bin/cov-build --dir cov-int make -j 4

      - name: Submit to Coverity Scan
        if: steps.token.outputs.present == 'true'
        working-directory: dismount
        run: |
          tar czf dismount.tgz cov-int
          curl -fsS \
            --form token="$COVERITY_SCAN_TOKEN" \
            --form email=e@eladraz.com \
            --form file=@dismount.tgz \
            --form version="${GITHUB_SHA}" \
            --form description="dismount builds from GitHub Actions" \
            "https://scan.coverity.com/builds?project=$(printf %s "$COVERITY_PROJECT" | sed 's|/|%2F|')"
